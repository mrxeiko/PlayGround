<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07111d">
<link rel="icon" href="data:,"><title>Ночная трасса — гонки</title>
<style>
:root{color-scheme:dark;--cyan:#62f5e3;--white:#eff8ff;--muted:#91a9bb;--panel:rgba(8,19,32,.78)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white);touch-action:none}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,150vh);height:min(100vh,66.6667vw);min-height:320px;overflow:hidden;background:#081624;isolation:isolate}canvas{display:block;width:100%;height:100%}.topbar{position:absolute;inset:0 0 auto;z-index:2;padding:clamp(14px,3vw,34px);display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand{display:flex;gap:12px;align-items:center}.brand-icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid #65f5e45a;border-radius:13px;background:#102c38;color:var(--cyan);font-size:21px;box-shadow:0 0 25px #31dfc522}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.23em;font-weight:800}.brand strong{display:block;font-size:14px;letter-spacing:.1em;margin-top:3px}.hud{display:flex;gap:10px}.stat{min-width:84px;padding:10px 13px;border:1px solid #ffffff19;border-radius:12px;background:var(--panel);backdrop-filter:blur(12px);text-align:right}.stat label{display:block;color:#9eb3c3;font-size:9px;letter-spacing:.16em;font-weight:800}.stat b{font-size:17px;font-variant-numeric:tabular-nums}.stat b span{font-size:9px;color:var(--cyan);margin-left:3px}.speedbox{position:absolute;left:clamp(14px,3vw,34px);bottom:clamp(18px,4vw,36px);z-index:2;pointer-events:none}.speed{font-size:clamp(38px,6vw,68px);font-weight:850;line-height:.9;letter-spacing:-.07em;font-variant-numeric:tabular-nums;text-shadow:0 0 26px #40eddb55}.speed small{font-size:11px;color:var(--cyan);letter-spacing:.18em;margin-left:6px}.speedlabel{font-size:9px;color:#99b2c5;letter-spacing:.24em;font-weight:800;margin-top:9px}.nitro-wrap{width:155px;height:4px;background:#ffffff25;margin-top:11px;border-radius:9px;overflow:hidden}.nitro-fill{height:100%;width:100%;background:linear-gradient(90deg,#21b9db,#73ffe5);box-shadow:0 0 12px #61f5e3;transition:width .15s}.distance{position:absolute;right:clamp(14px,3vw,34px);bottom:clamp(18px,4vw,36px);z-index:2;text-align:right;pointer-events:none}.distance b{font-size:24px;font-variant-numeric:tabular-nums}.distance span{display:block;color:#9eb3c3;font-size:9px;letter-spacing:.18em;font-weight:800;margin-top:3px}.overlay{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:20px;background:linear-gradient(90deg,#06111b70,#06111b1a,#06111b70);transition:opacity .25s,visibility .25s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(440px,92vw);padding:clamp(23px,4vw,38px);text-align:center;border:1px solid #c9fcff24;border-radius:23px;background:linear-gradient(145deg,#102334eF,#091622f2);box-shadow:0 24px 90px #0009, inset 0 1px #ffffff12;backdrop-filter:blur(18px)}.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--cyan);font-weight:900}.card h1{font-size:clamp(31px,6vw,47px);line-height:.95;letter-spacing:-.06em;margin:12px 0}.card p{color:#afc2d0;font-size:13px;line-height:1.55;margin:13px auto 22px;max-width:330px}.best{font-size:11px;color:#aec0cc;margin:-8px 0 20px}.best b{color:var(--white)}button{font:inherit;color:inherit}.primary{width:100%;border:0;border-radius:12px;padding:15px 20px;background:linear-gradient(100deg,#67f3dd,#50c9e8);color:#06202a;font-size:12px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 8px 26px #53e3dc38;cursor:pointer}.primary:active{transform:translateY(1px)}.hint{color:#7791a3;font-size:10px;margin-top:15px;letter-spacing:.04em}.mobile-controls{display:none;position:absolute;inset:auto 0 14px;z-index:3;justify-content:space-between;padding:0 14px;pointer-events:none}.control-group{display:flex;gap:10px}.touch-btn{pointer-events:auto;width:58px;height:58px;border:1px solid #ffffff42;border-radius:18px;background:#0b1c2bc9;color:#efffff;font-size:23px;backdrop-filter:blur(10px);box-shadow:0 8px 20px #0004;touch-action:none}.touch-btn.nitro{width:68px;font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--cyan);border-color:#62f5e35e}.touch-btn:active,.touch-btn.down{background:#1b4450}.toast{position:absolute;top:24%;left:50%;transform:translate(-50%,-10px);z-index:2;color:#fff;font-size:11px;font-weight:900;letter-spacing:.16em;text-shadow:0 0 15px #60ffe4;opacity:0;pointer-events:none}.toast.show{animation:toast 1.3s ease}@keyframes toast{10%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
@media(max-width:700px){.game{width:100vw;height:100dvh;min-height:0}.topbar{padding:14px}.brand-icon{width:35px;height:35px}.brand strong{font-size:11px}.brand small{font-size:8px}.hud{gap:6px}.stat{min-width:67px;padding:8px 9px}.stat label{font-size:8px}.stat b{font-size:14px}.speedbox{bottom:96px}.distance{bottom:99px}.mobile-controls{display:flex}.overlay{background:linear-gradient(#07111b88,#06111b35,#06111b99)}.card{padding:25px}.hint{font-size:0}.hint:after{content:"КНОПКИ СЛЕВА — РУЛЬ  ·  N₂O — УСКОРЕНИЕ";font-size:9px}}
</style>
</head>
<body>
<main class="game" id="game">
<canvas id="scene" aria-label="Игра Ночная трасса"></canvas>
<header class="topbar"><div class="brand"><div class="brand-icon">✦</div><div><small>ARCADE RACING</small><strong>НОЧНАЯ ТРАССА</strong></div></div><div class="hud"><div class="stat"><label>ОЧКИ</label><b id="score">00000</b></div><div class="stat"><label>РЕКОРД</label><b id="bestHud">00000</b></div></div></header>
<div class="speedbox"><div class="speed"><span id="speed">000</span><small>КМ/Ч</small></div><div class="speedlabel">СКОРОСТЬ</div><div class="nitro-wrap"><div class="nitro-fill" id="nitroFill"></div></div></div>
<div class="distance"><b id="distance">0.0</b><span>КМ ПРОЙДЕНО</span></div>
<div class="toast" id="toast">ОБГОН +250</div>
<div class="mobile-controls"><div class="control-group"><button class="touch-btn" data-action="left" aria-label="Влево">‹</button><button class="touch-btn" data-action="right" aria-label="Вправо">›</button></div><button class="touch-btn nitro" data-action="nitro">N₂O</button></div>
<section class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">ГОРОД НЕ СПИТ</div><h1 id="title">Ночная<br>трасса</h1><p id="message">Уходи от потока, держи скорость и пронесись сквозь огни большого города.</p><div class="best" id="bestLine">Личный рекорд: <b>0</b></div><button class="primary" id="startBtn">Старт заезда</button><div class="hint">← → / A D — РУЛЬ &nbsp; · &nbsp; SHIFT / SPACE — НИТРО</div></div></section>
</main>
<script>
(()=>{
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
const ui={score:document.getElementById('score'),best:document.getElementById('bestHud'),speed:document.getElementById('speed'),distance:document.getElementById('distance'),nitro:document.getElementById('nitroFill'),overlay:document.getElementById('overlay'),title:document.getElementById('title'),eyebrow:document.getElementById('eyebrow'),message:document.getElementById('message'),bestLine:document.getElementById('bestLine'),start:document.getElementById('startBtn'),toast:document.getElementById('toast')};
let W=0,H=0,dpr=1,last=0,elapsed=0,roadTime=0,mode='ready',score=0,distance=0,best=Number(localStorage.getItem('night-racer-best')||0),speed=0,nitro=100,nitroOn=false,lane=1,visualLane=1,traffic=[],particles=[],spawn=0,flash=0;
const lanes=4,colors=['#f36552','#f4bd55','#5de4cb','#9488ff','#ec6bb1','#e6edf2','#58a8ff'];
ui.best.textContent=String(best).padStart(5,'0');ui.bestLine.innerHTML=`Личный рекорд: <b>${best}</b>`;
function resize(){const r=game.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function roadPoint(t){const sway=Math.sin(roadTime*.18)*W*.018;const center=W*.5+sway*(.3+t*.7);const half=W*(.13+.34*Math.pow(t,.83));return {center,half,y:H*(.205+t*.82)}}
function laneX(index,t){const p=roadPoint(t);return p.center-p.half+(index+.5)*(p.half*2/lanes)}
function poly(points,fill){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function drawSky(){const sky=ctx.createLinearGradient(0,0,0,H*.62);sky.addColorStop(0,'#07111d');sky.addColorStop(.55,'#14283c');sky.addColorStop(1,'#56354b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
const glow=ctx.createRadialGradient(W*.5,H*.29,4,W*.5,H*.34,W*.42);glow.addColorStop(0,'#f98b7940');glow.addColorStop(1,'#fa887900');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H*.65);
// distant skyline
for(let side=0;side<2;side++){const dir=side?1:-1;let x=side?W*.57:0;let i=0;while(side?x<W:x<W*.43){const seed=Math.sin((i+1)*(side?91:37))*10000;const rw=18+Math.abs(seed%45),rh=35+Math.abs((seed*2)%100);const y=H*.37-rh;ctx.fillStyle=i%3===0?'#142738':'#102235';ctx.fillRect(x,y,rw,rh);if(i%2===0){ctx.fillStyle='#ffcf7440';for(let wy=y+10;wy<H*.37-5;wy+=13)for(let wx=x+6;wx<x+rw-4;wx+=10)if(Math.sin(wx*3+wy)>-.1)ctx.fillRect(wx,wy,2,3)}x+=rw-1;i++}}
}
function drawRoad(){const top=roadPoint(0),bottom=roadPoint(1);const farLeft=top.center-top.half,farRight=top.center+top.half,left=bottom.center-bottom.half,right=bottom.center+bottom.half;
const ground=ctx.createLinearGradient(0,H*.34,0,H);ground.addColorStop(0,'#172a36');ground.addColorStop(1,'#07131d');ctx.fillStyle=ground;ctx.fillRect(0,H*.35,W,H*.65);
// roadside lights and shoulders
for(let i=0;i<13;i++){const t=((i/13+((roadTime*.13)%1))%1);const p=roadPoint(t);for(const s of [-1,1]){const x=p.center+s*(p.half+W*(.025+t*.035)),y=p.y;const size=1+t*5;ctx.fillStyle=`rgba(91,242,224,${.18+t*.42})`;ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();if(i%3===0){ctx.strokeStyle=`rgba(91,242,224,${.09+t*.12})`;ctx.lineWidth=1+t;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-size*6);ctx.stroke()}}}
poly([[farLeft,H*.205],[farRight,H*.205],[right,H],[left,H]],'#1b2632');
// asphalt subtle gradient
const as=ctx.createLinearGradient(0,H*.2,0,H);as.addColorStop(0,'#303b47');as.addColorStop(.55,'#252f3a');as.addColorStop(1,'#1c2732');poly([[farLeft,H*.205],[farRight,H*.205],[right,H],[left,H]],as);
// edge strips
for(const s of [-1,1]){const off=s<0?-1:1;poly([[top.center+off*top.half*.97,H*.205],[top.center+off*top.half,H*.205],[bottom.center+off*bottom.half,H],[bottom.center+off*bottom.half*.97,H]],'#f26666');}
// dashed lane markings
const period=H*.115,offset=(roadTime*H*(mode==='playing'?.19:.035))%period;
for(let laneLine=1;laneLine<lanes;laneLine++){for(let y=H*.205-offset;y<H;y+=period){const t=clamp((y-H*.205)/(H*.82),0,1);const dashH=H*(.022+.033*t);const p1=roadPoint(t),p2=roadPoint(clamp(t+dashH/(H*.82),0,1));const frac=laneLine/lanes;const x1=p1.center-p1.half+2*p1.half*frac,x2=p2.center-p2.half+2*p2.half*frac;ctx.strokeStyle=`rgba(226,241,245,${.35+.3*t})`;ctx.lineWidth=1+t*4;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y+dashH);ctx.stroke()}}
// vignette
const v=ctx.createRadialGradient(W*.5,H*.55,H*.18,W*.5,H*.55,H*.8);v.addColorStop(.5,'#00000000');v.addColorStop(1,'#020812a8');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function drawCar(x,y,w,color,player=false){const h=w*1.52;ctx.save();ctx.translate(x,y);ctx.shadowColor=player?'#4ef5e0':color;ctx.shadowBlur=player?18:10;
// wheels
ctx.fillStyle='#080d13';ctx.fillRect(-w*.54,-h*.67,w*.17,h*.32);ctx.fillRect(w*.37,-h*.67,w*.17,h*.32);ctx.fillRect(-w*.54,h*.38,w*.17,h*.3);ctx.fillRect(w*.37,h*.38,w*.17,h*.3);
// body
const body=ctx.createLinearGradient(-w/2,0,w/2,0);body.addColorStop(0,'#10151d');body.addColorStop(.18,color);body.addColorStop(.8,color);body.addColorStop(1,'#10151d');ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(-w*.44,h*.43);ctx.lineTo(-w*.5,-h*.35);ctx.quadraticCurveTo(-w*.48,-h*.52,-w*.31,-h*.59);ctx.lineTo(-w*.2,-h*.91);ctx.quadraticCurveTo(0,-h*1.04,w*.2,-h*.91);ctx.lineTo(w*.31,-h*.59);ctx.quadraticCurveTo(w*.48,-h*.52,w*.5,-h*.35);ctx.lineTo(w*.44,h*.43);ctx.quadraticCurveTo(0,h*.53,-w*.44,h*.43);ctx.fill();ctx.shadowBlur=0;
// windshield and roof
ctx.fillStyle=player?'#163544':'#172b39';ctx.beginPath();ctx.moveTo(-w*.27,-h*.55);ctx.lineTo(-w*.17,-h*.84);ctx.quadraticCurveTo(0,-h*.91,w*.17,-h*.84);ctx.lineTo(w*.27,-h*.55);ctx.quadraticCurveTo(0,-h*.47,-w*.27,-h*.55);ctx.fill();ctx.fillStyle='#bad9db21';ctx.beginPath();ctx.moveTo(-w*.2,-h*.79);ctx.lineTo(0,-h*.86);ctx.lineTo(w*.2,-h*.79);ctx.lineTo(w*.24,-h*.61);ctx.lineTo(-w*.24,-h*.61);ctx.fill();
// hood stripe / highlights
if(player){ctx.fillStyle='#d9fff0';ctx.fillRect(-w*.035,-h*.39,w*.07,h*.73);ctx.fillStyle='#8cfff0';ctx.fillRect(-w*.42,-h*.12,w*.05,h*.47);ctx.fillRect(w*.37,-h*.12,w*.05,h*.47)}
ctx.fillStyle=player?'#a7fff5':'#ff585c';ctx.shadowColor=player?'#a7fff5':'#ff4048';ctx.shadowBlur=9;ctx.fillRect(-w*.39,h*.25,w*.19,h*.075);ctx.fillRect(w*.2,h*.25,w*.19,h*.075);ctx.shadowBlur=0;
ctx.fillStyle='#d9faff';ctx.fillRect(-w*.38,-h*.44,w*.14,h*.04);ctx.fillRect(w*.24,-h*.44,w*.14,h*.04);ctx.restore();return h}
function drawWorld(){drawSky();drawRoad();for(const car of traffic){const t=clamp(car.p,0,1.08),w=(W*.027+W*.062*Math.pow(t,1.65)),x=laneX(car.lane,t);drawCar(x,roadPoint(t).y,w,car.color,false)}
if(mode==='playing'||mode==='crashed'){const t=.78,x=laneX(visualLane,t),w=W*.085;drawCar(x,roadPoint(t).y,w,'#42d9d3',true)}
for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}
function updateUI(){ui.score.textContent=String(Math.floor(score)).padStart(5,'0');ui.best.textContent=String(best).padStart(5,'0');ui.speed.textContent=String(Math.round(speed)).padStart(3,'0');ui.distance.textContent=(distance/1000).toFixed(1);ui.nitro.style.width=nitro+'%'}
function startGame(){score=0;distance=0;speed=90;nitro=100;lane=1;visualLane=1;traffic=[];particles=[];spawn=.8;elapsed=0;mode='playing';ui.overlay.classList.add('hidden');last=performance.now()}
function endGame(){mode='crashed';flash=.65;for(let i=0;i<28;i++)particles.push({x:laneX(visualLane,.78),y:roadPoint(.78).y,vx:(Math.random()-.5)*250,vy:(Math.random()-.65)*250,life:1,size:2+Math.random()*5,color:['#ffc26b','#63ffe6','#ff6b65'][i%3]});if(score>best){best=Math.floor(score);localStorage.setItem('night-racer-best',best);ui.bestLine.innerHTML=`Новый рекорд: <b>${best}</b>`}else ui.bestLine.innerHTML=`Личный рекорд: <b>${best}</b>`;ui.eyebrow.textContent='ЗАЕЗД ОКОНЧЕН';ui.title.innerHTML='Красивая<br>гонка!';ui.message.textContent=`Ты пролетел ${(distance/1000).toFixed(1)} км и набрал ${Math.floor(score)} очков. Поток уже ждёт реванша.`;ui.start.textContent='Ещё заезд';ui.overlay.classList.remove('hidden')}
function showToast(text){ui.toast.textContent=text;ui.toast.classList.remove('show');void ui.toast.offsetWidth;ui.toast.classList.add('show')}
function move(dir){if(mode!=='playing')return;lane=clamp(lane+dir,0,lanes-1)}
function toggleNitro(on){nitroOn=on}
const keys={};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','Shift'].includes(e.key))e.preventDefault();if(e.repeat)return;keys[e.key.toLowerCase()]=true;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if((e.key===' '||e.key==='Shift')&&mode==='playing')toggleNitro(true);if((e.key==='Enter'||e.key===' ')&&mode!=='playing')startGame()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' '||e.key==='Shift')toggleNitro(false)});addEventListener('blur',()=>toggleNitro(false));
ui.start.addEventListener('click',startGame);game.querySelectorAll('.touch-btn').forEach(btn=>{const action=btn.dataset.action;const down=e=>{e.preventDefault();btn.classList.add('down');if(action==='left')move(-1);if(action==='right')move(1);if(action==='nitro')toggleNitro(true)};const up=e=>{e.preventDefault();btn.classList.remove('down');if(action==='nitro')toggleNitro(false)};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up)});
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;roadTime+=dt*(mode==='playing'?speed/45:.45);if(mode==='playing'){
 elapsed+=dt;visualLane+=(lane-visualLane)*Math.min(1,dt*12);const useNitro=nitroOn&&nitro>0;const target=useNitro?238:Math.min(195,132+elapsed*2.15);speed+=(target-speed)*Math.min(1,dt*(useNitro?2.8:1.15));if(useNitro)nitro=Math.max(0,nitro-dt*27);else nitro=Math.min(100,nitro+dt*5.2);
 distance+=speed/3.6*dt;score+=speed*dt*.19;spawn-=dt;const interval=Math.max(.56,1.12-elapsed*.009);if(spawn<=0){let l=Math.floor(Math.random()*lanes);if(traffic.length&&Math.random()<.45)l=(traffic[traffic.length-1].lane+1+Math.floor(Math.random()*3))%lanes;traffic.push({lane:l,p:-.035,color:colors[Math.floor(Math.random()*colors.length)],passed:false});spawn=interval*(.75+Math.random()*.55)}
 for(const c of traffic){const before=c.p;c.p+=dt*(.19+speed/920);if(!c.passed&&before<.78&&c.p>=.78){if(c.lane===lane){endGame();break}else{c.passed=true;score+=250;nitro=Math.min(100,nitro+7);showToast('ОБГОН +250')}}if(c.p>.72&&c.p<.82&&c.lane===lane){endGame();break}}
 traffic=traffic.filter(c=>c.p<1.12);if(useNitro&&Math.random()<dt*38){const p=roadPoint(.82);particles.push({x:laneX(visualLane,.82)+(Math.random()-.5)*W*.08,y:p.y+Math.random()*H*.1,vx:(Math.random()-.5)*35,vy:70+Math.random()*120,life:.45,size:2+Math.random()*4,color:'#68ffeb'})}
 }else if(mode==='crashed'){flash=Math.max(0,flash-dt);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt*1.3}particles=particles.filter(p=>p.life>0);speed*=Math.max(0,1-dt*3)}else{speed=0;visualLane+=(lane-visualLane)*Math.min(1,dt*5)}
 drawWorld();if(flash>0){ctx.fillStyle=`rgba(255,87,76,${flash*.35})`;ctx.fillRect(0,0,W,H)}updateUI();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
